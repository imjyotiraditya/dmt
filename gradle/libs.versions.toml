[bundles]
coil = ["coil", "coil-network-ktor3"]
compose = [
    "androidx-activity-compose",
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-navigation-compose",
]
ktor = ["ktor-client-cio", "ktor-client-core"]
macrobenchmark = [
    "androidx-benchmark-macro-junit4",
    "androidx-test-ext-junit",
    "androidx-test-runner",
    "androidx-test-uiautomator",
]
media3 = [
    "androidx-media3-decoder-ffmpeg",
    "androidx-media3-exoplayer",
    "androidx-media3-exoplayer-midi",
    "androidx-media3-inspector",
    "androidx-media3-session",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baseline-profile" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
