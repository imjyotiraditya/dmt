[versions]
core-ktx = "1.19.0"
coroutines-guava = "1.11.0"
junit = "4.13.2"
media3 = "1.11.0-rc01-dmt"
robolectric = "4.16.1"
room = "2.8.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-inspector = { group = "androidx.media3", name = "media3-inspector", version.ref = "media3" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutines-guava" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[bundles]
media3 = ["androidx-media3-exoplayer", "androidx-media3-inspector"]
room = ["androidx-room-ktx", "androidx-room-runtime"]
